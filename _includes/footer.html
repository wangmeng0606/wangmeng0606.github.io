{% include base_path %}

<div class="page__footer-row">
  <div class="page__footer-copyright">&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}</div>
  <nav class="page__footer-links" aria-label="Academic profiles">
    <a href="{{ site.author.googlescholar }}" aria-label="Google Scholar" title="Google Scholar" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zM5.5 13.2v3.3C5.5 18.4 8.4 20 12 20s6.5-1.6 6.5-3.5v-3.3L12 16.7l-6.5-3.5z"/></svg>
    </a>
    <a href="{{ site.author.orcid }}" aria-label="ORCID" title="ORCID" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1a11 11 0 1 0 0 22 11 11 0 0 0 0-22zM8.2 6.2a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zM7.4 9.3h1.6v7.4H7.4V9.3zm3.1 0h2.8c2.6 0 3.9 1.6 3.9 3.7s-1.5 3.7-3.9 3.7h-2.8V9.3zm1.6 1.4v4.6h1.1c1.7 0 2.3-1.1 2.3-2.3s-.7-2.3-2.3-2.3h-1.1z"/></svg>
    </a>
    <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" aria-label="LinkedIn" title="LinkedIn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.4 2H3.6A1.6 1.6 0 0 0 2 3.6v16.8A1.6 1.6 0 0 0 3.6 22h16.8a1.6 1.6 0 0 0 1.6-1.6V3.6A1.6 1.6 0 0 0 20.4 2zM8 19H5V9.5h3V19zM6.5 8.2a1.7 1.7 0 1 1 0-3.5 1.7 1.7 0 0 1 0 3.5zM19 19h-3v-4.6c0-1.1 0-2.5-1.5-2.5S12.9 13 12.9 14.3V19h-3V9.5h2.8v1.3c.4-.8 1.4-1.5 2.8-1.5 3 0 3.5 2 3.5 4.5V19z"/></svg>
    </a>
    {% if site.author.cv_pdf %}
    <a href="{{ base_path }}{{ site.author.cv_pdf }}" aria-label="Download CV" title="Download CV" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 1.5L18.5 9H14a1 1 0 0 1-1-1V3.5zM8 13h8v1.5H8V13zm0 3h8v1.5H8V16z"/></svg>
    </a>
    {% endif %}
  </nav>
</div>
